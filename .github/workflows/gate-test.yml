name: gate-test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "pretend terraform plan"
      - run: test -f check.txt

  apply:
    needs: plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "pretend terraform apply"

  deploy:
    needs: apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "pretend deploy"

